name: Jobradar

on:
  schedule:
    # Täglich 05:40 UTC. Krumme Minute, weil Actions zur vollen Stunde
    # regelmäßig verzögert starten.
    - cron: "40 5 * * *"
  workflow_dispatch:        # Handstart über den Actions-Tab

permissions:
  contents: write           # für den Commit von data/jobs.json
  pages: write
  id-token: write

concurrency:
  group: jobradar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Beide optional. Fehlen sie, läuft der Scan trotzdem:
      # ohne ORS_API_KEY werden Fahrzeiten geschätzt und im Dashboard als
      # geschätzt ausgewiesen; ohne JOBSPY_PROXIES bleibt der LinkedIn-Teil
      # leer (siehe README).
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Lauf
        run: python -m jobradar.scan

      - name: Ergebnisse sichern
        run: |
          git config user.name "jobradar"
          git config user.email "jobradar@users.noreply.github.com"
          # -A statt Einzelpfade: data/fahrzeiten.json entsteht erst beim
          # ersten Lauf, ein fehlender Pfad liesse "git add" scheitern.
          git add -A data site/index.html
          git diff --staged --quiet || git commit -m "Lauf $(date -u +%Y-%m-%d)"
          # Falls zwischendurch selbst gepusht wurde, sonst scheitert der Push.
          git pull --rebase --autostash
          git push

      # NUR site/ hochladen, niemals das Repositorywurzelverzeichnis.
      # Mit "path: ." lagen CLAUDE.md (persönliches Profil, Wohnort,
      # Knockout-Kriterien) und config.yaml (komplette Suchstrategie) unter
      # der öffentlichen Pages-URL. site/ enthält nur das Dashboard.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  veroeffentlichen:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
