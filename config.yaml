# Jobradar – Konfiguration
# Alles, was du regelmäßig anfassen wirst, steht hier. Der Code bleibt unberührt.
#
# GRUNDSATZ seit dem Umbau vom 11.08.2026: Es wird so wenig wie möglich
# entfernt und so viel wie möglich sortiert. Berufsbezeichnungen sind in
# diesem Feld unzuverlässig — dieselbe Tätigkeit heißt je nach Arbeitgeber
# "Referent*in Öffentlichkeitsarbeit", "Sachbearbeitung Kommunikation",
# "Mitarbeiter*in Stabsstelle", "Online-Redakteur*in" oder
# "Marketingassistenz". Deshalb urteilt das Radar über den ANZEIGENTEXT
# (siehe `passung`) und nicht mehr über den Titel.
#
# Nur drei Kriterien entfernen eine Stelle aus der Standardansicht:
# Erreichbarkeit (Fahrzeit), Umfang unter der Mindeststundenzahl und ein
# zwingend gefordertes Studium. Alles andere ist Markierung oder Punktabzug.

standort:
  # Ankerpunkt. `wo` geht als Ortsangabe an die BA-API, `ort` an das Geocoding.
  wo: "57577"
  ort: "Hamm (Sieg)"
  # Mittelpunkt der Karte. Nur fuer die Darstellung — gerechnet wird mit der
  # Fahrzeit, nicht mit diesen Koordinaten.
  breite: 50.7536
  laenge: 7.7369
  # Suchradius der BA-Abfrage. Bewusst großzügig: Die eigentliche Grenze zieht
  # die Fahrzeitprüfung (siehe `erreichbarkeit`), nicht dieser Wert.
  umkreis_km: 60

  # Grobe Ortskenntnis für Quellen ohne Entfernungsangabe (RSS liefert nur
  # "Ort: 15848 Beeskow"). Dient NICHT mehr als harter Filter, sondern als
  # letzter Schätzer für die Fahrzeit, wenn weder ORS noch eine
  # Entfernungsangabe der Quelle vorliegen. Siehe erreichbarkeit.schaetzung.
  plz_praefixe:
    - "570"   # Siegen
    - "572"   # Kreuztal, Netphen, Freudenberg, Neunkirchen, Burbach
    - "575"   # Betzdorf, Wissen, Kirchen, Daaden, Herdorf, Hamm/Sieg
    - "576"   # Altenkirchen, Hachenburg, Weyerbusch
    - "515"   # Waldbröl, Windeck, Nümbrecht, Morsbach, Reichshof
    - "535"   # Linz, Neustadt/Wied
    - "536"   # Bad Honnef, Rheinbreitbach
    - "537"   # Siegburg, Hennef, Eitorf, Lohmar
    - "562"   # Höhr-Grenzhausen, Ransbach-Baumbach, Dierdorf
    - "563"   # Puderbach
    - "564"   # Montabaur, Westerburg
    - "565"   # Neuwied
    - "574"   # Olpe, Attendorn, Wenden, Drolshagen
    - "516"   # Gummersbach, Wiehl
    - "356"   # Dillenburg
    - "357"   # Herborn, Driedorf
    - "531"   # Bonn — mit Fahrzeitprüfung wieder zulässig, hybrid/remote
    - "560"   # Koblenz — dito

lauf:
  veroeffentlicht_seit_tagen: 30
  treffer_pro_begriff: 100
  pause_sekunden: 0.6
  # 0 = nicht mehr gefundene Anzeigen sofort entfernen, statt sie
  # als "nicht mehr gelistet" mitzuschleppen. Gegen versehentliches
  # Leeren des Bestands schuetzt QuellenAusfall, nicht dieser Wert.
  verfall_tage: 0

# ---------------------------------------------------------------------------
# Harte Filter. NUR diese drei entfernen Stellen aus der Standardansicht.
# Jeder Grund wird gezählt und ist im Dashboard einzeln einblendbar, damit
# auffällt, wenn ein Muster zu breit greift.
# ---------------------------------------------------------------------------
harte_filter:
  # Fehlende Stundenangabe schließt NICHT aus.
  mindest_wochenstunden: 20
  # Nur Status "hart" (Studium ohne genannte Alternative). "weich" bleibt
  # sichtbar — das ist der Fall, in dem Berufserfahrung greift.
  studium_zwingend_ausschliessen: true

verguetung:
  # Wird NICHT gefiltert: fehlt in der BA-Datenbank meistens, und
  # "keine Angabe" ist kein Ausschluss. Nur zur Anzeige, wenn im Text steht.
  minimum_vollzeit_eur: 3000
  muster:
    - 'TV[öO]D[- ]?[A-Za-z]*\s*(?:E\s?)?\d{1,2}'
    - 'TV-?L\s*(?:E\s?)?\d{1,2}'
    - 'Entgeltgruppe\s*\d{1,2}'
    - 'EG\s*\d{1,2}\b'
    - 'A\s?\d{1,2}\s*(?:LBesO|BBesO)'

# ---------------------------------------------------------------------------
# Titel-Ausschlussmuster — SEIT 11.08.2026 NICHT MEHR HART.
#
# `ausschluss_titel_hart: false` heißt: Diese Muster entfernen nichts mehr.
# Sie wirken nur noch als Punktabzug im Scoring (passung.reibung.titel_abwertung)
# und werden im Dashboard als Reibungsmarker angezeigt.
#
# Grund für die Umstellung: Der Filter hat nachweislich Passendes gekillt —
# "Performance Marketing Manager (m/w/d)" in 57520 Niederdreisbach, 25 km
# entfernt, mit "bis zu 100 % Remote", verschwand ohne jede Spur. Ein Titel
# ist in diesem Feld ein zu schwaches Signal für eine Entfernungsentscheidung.
# ---------------------------------------------------------------------------
ausschluss_titel_hart: false
ausschluss_titel:
  - '\bSEA\b'
  - '\bSEO\b'
  - "Google Ads"
  - "Meta Ads"
  - "Media[- ]?Buyer"
  - "E-?Commerce"
  - "Influencer"
  - "Affiliate"
  - 'Vertriebsmitarbeiter|Außendienstmitarbeiter|Verkäufer\b'

# ---------------------------------------------------------------------------
# Archetypen: bestimmen Suchbegriffe UND Gruppierung im Dashboard.
# Jeder Begriff geht EINZELN an die BA-API — kombinierte Begriffe liefern
# schlechtere Treffer (gemessen 09.08.2026: "Stadtmarketing Tourismus" → 0,
# "Stadtmarketing" → 3).
#
# Der Cluster `angrenzend` ist der eigentliche Zweck des Umbaus: Stellen,
# deren Titel nichts mit Kommunikation zu tun hat, deren Aufgabenbeschreibung
# aber überwiegend daraus besteht. Ob so eine Stelle sichtbar wird, entscheidet
# jetzt `passung` am Text, nicht der Titel.
# ---------------------------------------------------------------------------
archetypen:
  - id: kommunikation
    label: "Kommunikation & Öffentlichkeitsarbeit"
    rang: 1
    notiz: "Der Kern der Suche. Titel variieren stark, deshalb viele Varianten."
    begriffe:
      - Öffentlichkeitsarbeit
      - Presse- und Öffentlichkeitsarbeit
      - Unternehmenskommunikation
      - Kommunikationsreferent
      - Pressereferent
      - Pressesprecher
      - Stabsstelle Kommunikation
      - Kommunikationsmanager
      - Corporate Communications

  - id: redaktion
    label: "Redaktion & Content"
    rang: 2
    notiz: "Textarbeit als Hauptaufgabe."
    begriffe:
      - Redakteur
      - Online-Redakteur
      - Content Manager
      - Newsletter Redaktion
      - Redaktion Website

  - id: video
    label: "Bewegtbild & Medienproduktion"
    rang: 3
    notiz: "Das gelernte Handwerk: Mediengestalter Bild und Ton (IHK)."
    begriffe:
      - Mediengestalter Bild und Ton
      - Videoproduktion
      - Videoredaktion
      - Kamera Schnitt
      - Bewegtbild
      - Medienproduktion

  - id: wissenschaftskommunikation
    label: "Wissenschaftskommunikation"
    rang: 4
    notiz: "Produkt statt Überzeugungsarbeit. Häufigste Ausnahme vom Studiumszwang."
    begriffe:
      - Wissenschaftskommunikation
      - Science Communication
      - Öffentlichkeitsarbeit Forschung
      - Social Media Wissenschaft
      - Videoredaktion Forschung

  - id: marketing
    label: "Marketing & Kampagnen"
    rang: 5
    notiz: "Zweite Berufserfahrung. Belegstärke laut Suchprofil: stark."
    begriffe:
      - Marketingreferent
      - Social Media
      - Kampagnenmanagement
      - Online Marketing

  - id: angrenzend
    label: "Angrenzend – Titel täuscht, Aufgabe passt"
    rang: 6
    notiz: >-
      Hier stehen Stellen, deren Titel nichts mit Kommunikation zu tun hat.
      Ob eine davon taugt, entscheidet der Score am Aufgabentext. Ein hoher
      Score in diesem Cluster ist der Beweis, dass der Umbau funktioniert.
    begriffe:
      - Bildungsreferent
      - Fundraising
      - Veranstaltungsmanagement
      - Wirtschaftsförderung
      - Standortmarketing
      - Medienpädagogik
      - Kulturmanagement

# ---------------------------------------------------------------------------
# Passung: inhaltliches Scoring am ANZEIGENTEXT statt am Titel.
#
# Gezählt wird, wie viele verschiedene Gruppen im Text vorkommen; jede Gruppe
# zählt einmal mit ihrem Gewicht, unabhängig davon, wie oft ihre Muster
# auftauchen. Sonst gewinnt die Anzeige, die "Video" zwanzigmal schreibt,
# gegen die, die drei verschiedene passende Aufgaben nennt.
#
# Stellschrauben sind die Gewichte. Wer mehr Bewegtbild will, hebt dort.
# ---------------------------------------------------------------------------
passung:
  aufgaben:
    bewegtbild:
      gewicht: 3
      muster: [Video, Bewegtbild, Schnitt, Kamera, Videoproduktion, Reels, Imagefilm, Dreh]
    redaktion:
      gewicht: 3
      muster: [Redaktion, Texten, Pressemitteilung, Newsletter, "Beiträge verfassen", "Website pflegen"]
    social:
      gewicht: 2
      muster: ["Social Media", Instagram, LinkedIn, Community, "Kanäle betreuen"]
    dokumentation:
      gewicht: 2
      muster: ["Veranstaltungen dokumentieren", Fotos, Bildmaterial, Archiv]
    rechte:
      gewicht: 2
      muster: [Bildrechte, Nutzungsrechte, Lizenz, Urheberrecht]
    grafik:
      gewicht: 1
      muster: [Grafik, Layout, Gestaltung, InDesign]

  reibung:
    cms:
      gewicht: -1
      muster: [TYPO3, Drupal, Contao, WordPress, Content-Management-System]
    ehrenamt:
      gewicht: -3
      muster: [Ehrenamt, Freiwillige, Vereinsarbeit, Ortsgruppen]
    vertrieb:
      gewicht: -2
      muster: [Akquise, Vertrieb, Neukunden, Umsatzziel]
    titel_abwertung:
      gewicht: -2   # greift, wenn ein Muster aus ausschluss_titel im Titel steht

# ---------------------------------------------------------------------------
# Erreichbarkeit: Fahrzeit statt Luftlinie, plus Wochenbudget.
#
# Arbeitsmodell wird aus dem Anzeigentext erkannt (remote / hybrid / onsite /
# unklar). ABGRENZUNG: "Homeoffice möglich" und "anteilig mobil" sind HYBRID,
# nicht remote — sonst rutscht jede Stelle mit Gleitzeitfloskel durch.
#
# `unklar` wird NICHT gefiltert, sondern gegen die Hybrid-Schwelle geprüft und
# markiert. Grund: Forschungseinrichtungen und Verwaltungen nennen das Modell
# selten in der Ausschreibung; ein harter Ausschluss killt genau die Stellen,
# auf die es ankommt.
# ---------------------------------------------------------------------------
erreichbarkeit:
  wochenbudget_min: 450        # 7,5 h Fahrzeit pro Woche gesamt
  remote:
    max_fahrzeit_min: null     # unbegrenzt
  hybrid:
    max_fahrzeit_min: 75
  onsite:
    max_fahrzeit_min: 45
  unklar:
    # EIGENE Schwelle statt "behandeln_als: hybrid". Gemessen am 31.08.2026:
    # 225 von 268 sichtbaren Stellen nennen gar kein Arbeitsmodell — "unklar"
    # ist hier die Regel, nicht die Ausnahme. Mit der Hybrid-Schwelle (75 min)
    # standen davon 123 ueber 50 und 87 ueber 60 Minuten in der Liste, obwohl
    # unbekannt ist, ob man dort ueberhaupt mobil arbeiten darf.
    #
    # 60 min ist der Kompromiss: strenger als hybrid, weil die Erlaubnis nicht
    # belegt ist; grosszuegiger als onsite (45), weil viele dieser Anzeigen in
    # Wahrheit hybrid sind und ein harter Ausschluss genau die Verwaltungen
    # und Forschungseinrichtungen trifft, auf die es ankommt.
    #
    # `behandeln_als` wirkt weiterhin, falls max_fahrzeit_min fehlt.
    max_fahrzeit_min: 60
    behandeln_als: hybrid

  # OpenRouteService liefert reine PKW-Fahrzeit. Ohne ORS_API_KEY greift die
  # Schätzung unten, und JEDE geschätzte Zeit wird im Dashboard als solche
  # ausgewiesen — kein stiller Fallback.
  ors:
    profil: "driving-car"
    cache: "data/fahrzeiten.json"
  schaetzung:
    # Luftlinie × umweg_faktor ÷ schnitt_kmh. Der Umwegfaktor bildet ab, dass
    # Straßen nicht gerade verlaufen; 65 km/h ist ein realistischer Mittelwert
    # für Bundesstraßen im Westerwald mit Autobahnanteil.
    umweg_faktor: 1.35
    schnitt_kmh: 65
    # Letzte Rückfallebene für Quellen ohne jede Entfernungsangabe (RSS nennt
    # nur die PLZ). Liegt die PLZ in standort.plz_praefixe, wird diese Fahrzeit
    # angenommen, sonst jene. Beide bewusst so gewählt, dass "drin" unter der
    # Onsite-Schwelle und "draußen" über der Hybrid-Schwelle liegt.
    plz_treffer_min: 35
    plz_fehltreffer_min: 120

  arbeitsmodell:
    remote:
      - '(?:100|9\d)\s*%[^.;]{0,25}(?:remote|[Hh]ome\s?-?office|mobil(?:es)?\s+Arbeiten)'
      - '(?:remote|[Hh]ome\s?-?office)[^.;]{0,25}(?:100|9\d)\s*%'
      - 'voll(?:st(?:ä|ae)ndig|umf(?:ä|ae)nglich)?\s*(?:remote|im\s+[Hh]ome\s?-?office)'
      - '\bremote[- ]?first\b'
      - '\bvollremote\b'
      - '(?:deutschlandweit|bundesweit|ortsunabh(?:ä|ae)ngig)\s+(?:remote|arbeiten)'
      - 'ausschlie(?:ß|ss)lich\s+remote'
      - '\bTelearbeit\b\s*(?:zu\s*)?(?:100|9\d)\s*%'
    hybrid:
      - '[Hh]ome\s?-?office\s*(?:ist\s*)?(?:anteilig|teilweise|m(?:ö|oe)glich|nach\s+Absprache)'
      - 'anteilig\s+mobil|mobiles\s+Arbeiten|Telearbeit'
      - 'hybrid(?:es)?\s*(?:Arbeiten|Arbeitsmodell)?'
      - '\d\s*Tage?\s*(?:pro\s*Woche\s*)?(?:vor\s+Ort|im\s+B(?:ü|ue)ro|Pr(?:ä|ae)senz)'
      - '(?:ein|zwei|drei|vier)\s*(?:Pr(?:ä|ae)senztage?|Tage?\s+vor\s+Ort)'
      - 'Gleitzeit.{0,30}[Hh]ome\s?-?office'
    onsite:
      - 'aussschlie(?:ß|ss)lich\s+in\s+Pr(?:ä|ae)senz'
      - 'ausschlie(?:ß|ss)lich\s+in\s+Pr(?:ä|ae)senz'
      - 'kein\s+[Hh]ome\s?-?office|keine\s+M(?:ö|oe)glichkeit\s+(?:zum|zu)\s+[Hh]ome'
      - 'durchgehende\s+Pr(?:ä|ae)senz|volle\s+Pr(?:ä|ae)senzpflicht'
      - 'Anwesenheit\s+vor\s+Ort\s+(?:ist\s+)?(?:zwingend|erforderlich)'
  # Präsenztage für das Wochenbudget. Reihenfolge: Ziffer schlägt Wort.
  praesenztage:
    - '(\d)\s*(?:Tage?|x)\s*(?:pro\s*Woche\s*)?(?:vor\s+Ort|im\s+B(?:ü|ue)ro|Pr(?:ä|ae)senz)'
    - '(\d)\s*Pr(?:ä|ae)senztage?'
    - '(ein|zwei|drei|vier|f(?:ü|ue)nf)\s*Pr(?:ä|ae)senztage?'
    - '(ein|zwei|drei|vier|f(?:ü|ue)nf)\s*Tage?\s+vor\s+Ort'

# ---------------------------------------------------------------------------
# Deduplizierung über Quellen hinweg.
# Schwelle siehe CLAUDE.md — sie wurde gegen einen echten Negativfall geeicht.
# ---------------------------------------------------------------------------
dedupe:
  # Gemessen am 11.08.2026 mit difflib.SequenceMatcher auf normalisierten Titeln:
  #
  #   0.714  Pressesprecher            vs Pressereferent            -> getrennt
  #   0.769  Referent ÖA               vs Referent ÖA Schwerpunkt Video -> getrennt
  #   0.923  Mediengestalter Bild Ton  vs Mediengestalter Bild und Ton  -> zusammen
  #   0.938  Content Manager           vs Content Managerin         -> zusammen
  #   1.000  Referent*in ÖA (m/w/d)    vs Referent/-in ÖA           -> zusammen
  #
  # Die Schwelle muss also über 0.769 und höchstens 0.923 liegen. 0.85 sitzt
  # fast in der Mitte dieses Fensters. Wer sie senkt, legt irgendwann
  # "Schwerpunkt Video" mit der Grundstelle zusammen — genau der Fall, den
  # der Negativtest in tests/test_offline.py absichert.
  titel_aehnlichkeit: 0.85

# ---------------------------------------------------------------------------
# JobSpy (Indeed/LinkedIn). BEWUSST AUS.
# LinkedIn blockt Rechenzentrums-IPs zuverlässig; auf GitHub-Actions bleibt
# der LinkedIn-Teil ohne Wohn-Proxy leer. Das ist kein Fehler, sondern erwartet.
# Die Nutzungsbedingungen der Portale untersagen automatisierten Zugriff;
# das Einschalten ist eine bewusste Entscheidung des Betreibers.
# ---------------------------------------------------------------------------
jobspy:
  # EINGESCHALTET am 01.09.2026 auf ausdrücklichen Wunsch.
  aktiv: true
  # LinkedIn steht bewusst NICHT in der Liste: Es blockt Rechenzentrums-IPs,
  # auf GitHub Actions bliebe der Teil ohne Wohn-Proxy leer und würde nur
  # Laufzeit kosten. Wer es lokal testen will, trägt es hier ein und setzt
  # JOBSPY_PROXIES.
  sites: [indeed]
  # Bewusst knapp: Indeed liefert keine PLZ, die Fahrzeit lässt sich für
  # unbekannte Orte nicht bestimmen. Solche Treffer sind nicht filterbar und
  # sollen die Liste nicht dominieren.
  results_wanted: 20
  hours_old: 336
  linkedin_beschreibung_laden: false   # kostet massiv Durchsatz

# ---------------------------------------------------------------------------
# Zweiter, bundesweiter Suchlauf für Remote-Stellen.
# Die Muster dafür stehen NICHT hier, sondern in erreichbarkeit.arbeitsmodell —
# es gibt nur eine Definition von "remote" im ganzen Projekt.
#
# Ertrag am 09.08.2026 gemessen: 234 Kandidaten mit BA-Homeoffice-Kennzeichen,
# alle Volltexte geprüft, 0 erfüllten die Schwelle. Die Mechanik bleibt für den
# Fall, dass eine auftaucht; sie kostet rund 3 Minuten Laufzeit.
# ---------------------------------------------------------------------------
remote:
  aktiv: true
  max_details: 400

seiten_quellen:
  # Geprueft 11.08.2026. KEINE der geprueften Forschungseinrichtungen hat
  # JobPosting-Markup (JSON-LD) — weder auf der Uebersicht noch auf der
  # Einzelanzeige. Deshalb ueberall `markup: false`; der Volltext wird dann
  # aus dem HTML der Detailseite gezogen.
  #
  # Nicht aufgenommen, mit Grund:
  #   DZNE (jobs.dzne.de)      – Liste wird per JavaScript nachgeladen,
  #                              5 Links auf 26 kB. Nicht auslesbar.
  #   Uni Siegen               – alle geprueften Pfade liefern 404; die
  #                              richtige URL liess sich nicht ermitteln.
  #   Helmholtz (jobs.)        – Host nicht erreichbar (ConnectionError).
  #   MPG / Fraunhofer / DLR   – bundesweite Portale ohne festen Ort. Ohne
  #                              Ortsangabe greift die Fahrzeitpruefung nicht,
  #                              das Dashboard liefe mit Muenchen und Dresden
  #                              voll. Erst sinnvoll mit ortsgefilterter URL.
  #   FZ Juelich               – rund 95 km, ausserhalb jeder Pendelgrenze.

  - label: "Universität Bonn"
    arbeitgeber: "Rheinische Friedrich-Wilhelms-Universität Bonn"
    ort: "Bonn"
    # Luftlinie ab 57577; die Fahrzeitschaetzung rechnet daraus ~50 min.
    # Damit haengt die Aufnahme am Arbeitsmodell: hybrid ja, onsite nein.
    entfernung_km: 40
    archetyp: wissenschaftskommunikation
    url: "https://www.uni-bonn.de/de/universitaet/arbeiten-an-der-uni/stellenangebote"
    # Getestet: 32 echte Anzeigenlinks, Titel sauber im Linktext.
    link_muster: "stellenausschreibungen/[a-z0-9]"
    link_ausschluss: "datenschutz|impressum|tarifvertrag|informationen-zum"
    markup: false
    details_folgen: true
    max_details: 25

  - label: "Biologische Station Rhein-Sieg"
    arbeitgeber: "Biologische Station im Rhein-Sieg-Kreis e.V."
    ort: "Eitorf"
    entfernung_km: 25
    archetyp: angrenzend
    url: "https://www.biostation-rhein-sieg.de/%C3%BCber-uns/stellen/"
    # Verschärft: das alte Muster fing den Selbstlink "Stellen" und "zuklappen".
    link_muster: "stellenausschreibung|stellenangebot|ausschreibung|bewerb"
    link_ausschluss: "datenschutz|impressum|sitemap|zuklappen|^stellen$"
    # Geprüft 2026-08-09: Seite rendert serverseitig, hat aber kein
    # JobPosting-Markup und derzeit keine offene Stelle. details_folgen
    # kostet dann nur Anfragen. Wieder auf true, sobald dort etwas steht.
    details_folgen: false
    max_details: 10

  # ENTFERNT 2026-08-09: Kreisverwaltung Altenkirchen.
  # Die Seite führt keine Stellen mehr, sondern verweist auf Interamt
  # (interamt.de/koop/app/trefferliste?partner=3664) — und Interamt ist genau
  # die Quelle, aus der service.bund.de importiert. Die Stellen kommen also
  # bereits über den RSS-Weg herein. Die Quelle lieferte im Testlauf
  # ausschließlich Navigationsrauschen ("direkt zum Inhalt", "Vorlesen"),
  # ihre Detailseiten sind zusätzlich per robots.txt gesperrt.

  - label: "NABU Rheinland-Pfalz"
    arbeitgeber: "NABU Rheinland-Pfalz"
    ort: "Mainz / Regionalstellen"
    archetyp: angrenzend
    url: "https://rlp.nabu.de/wir-ueber-uns/stellenangebote/"
    # Verschärft: fing vorher "Landesgeschäftsstelle", "Regionalstellen",
    # "Vorlesen". Die echten Anzeigen heißen "…stellenausschreibung….pdf".
    link_muster: "stellenausschreibung|\\.pdf$"
    link_ausschluss: "datenschutz|impressum|spenden|vorlesen"
    # Die zwei echten Anzeigen sind PDFs — dort ist kein JSON-LD zu holen,
    # und die Detailseiten sind ohnehin per robots.txt gesperrt.
    # Screening läuft hier zwangsläufig nur über den Linktext.
    details_folgen: false
    max_details: 10


# Absicht: "Social Media" als eine Aufgabe unter vielen soll eine Anzeige nicht
# killen — nur wenn die Rolle SELBST danach benannt ist. Ausgeschlossene
# Anzeigen werden nicht angezeigt, aber im Fuß des Dashboards gezählt.
# ---------------------------------------------------------------------------

screening:
  studium:
    # "hart" schlägt "weich" nur, wenn kein weich-Muster im selben Text greift.
    hart:
      - "abgeschlossenes\\s+(wissenschaftliches\\s+)?(Hochschul|Fachhochschul|Universitäts)?studium"
      - "abgeschlossenes\\s+Studium"
      - "Hochschulabschluss"
      - "Diplom-?\\s?(Ingenieur|Biologe|Geograph)"
      - "Master\\b"
      - "Bachelor\\b"
    weich:
      - "oder\\s+(eine\\s+)?vergleichbare"
      - "bzw\\.\\s+eine\\s+abgeschlossene\\s+Berufsausbildung"
      - "abgeschlossene\\s+Berufsausbildung\\s+(oder|bzw)"
      - "vergleichbare\\s+(Ausbildung|Qualifikation|Erfahrung)"
      - "Quereinsteiger"

  # Dein Knockout-Kriterium: Durchsatz hängt an nicht-weisungsgebundenen Dritten.
  ehrenamtslogik:
    - "[Ee]hrenamtlich"
    - "Ehrenamt"
